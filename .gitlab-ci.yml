# Brave Omega Project — GitLab mirror CI (minimal).
# Canonical CI lives in .github/workflows (GitHub). This file only guards
# the mirror with the same pinned gitleaks secret scan. No other jobs on
# purpose: solo/hobby, zero extra maintenance.
# [TR] GitLab aynasi icin en az CI: ayna korumasi amacli sabitlenmis
# gitleaks gizli-anahtar taramasi. Asil CI GitHub tarafindadir.

variables:
  GIT_DEPTH: 0
  GITLEAKS_VERSION: v8.30.1

stages:
  - scan

secret-scan:
  stage: scan
  image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  before_script:
    - apk add --no-cache git curl tar
    - curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
    - curl -sSL -o /tmp/checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_checksums.txt"
    - cd /tmp && grep "gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" checksums.txt | sha256sum --check --strict && tar -xzf gitleaks.tar.gz gitleaks && cd -
  script:
    - /tmp/gitleaks git --redact --exit-code 1
