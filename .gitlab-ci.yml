# Brave Omega Project - GitLab mirror CI.
# Canonical CI lives in .github/workflows (GitHub). This file mirrors the same
# quality gates on the mirror so both sides run the same checks. Every tool
# follows the latest ref; checksum-verified downloads resolve the latest release
# and its checksum together at run time. GitLab-specific additions: Pages deployment (pages) and
# JUnit test report upload (pester-tests).
#
# IMPORTANT: CI is enabled. Account identity verification
# (GitLab > Settings > Account > Identity verification) has been completed, so
# these jobs run normally on push and schedule. No account-level gate is active.
#
# Mirrors:
#   .github/workflows/secret-scan.yml      -> secret-scan
#   .github/workflows/quality.yml          -> markdown-lint, yaml-validate,
#                                             powershell-syntax, pester-tests,
#                                             ps-script-analyzer, policy-integrity,
#                                             utf8-integrity, json-validity,
#                                             shellcheck
#   .github/workflows/admx-validate.yml    -> admx-validate
#   .github/workflows/version-check.yml    -> version-check
#   .github/workflows/hygiene.yml          -> hygiene (actionlint)
#   .github/workflows/link-check.yml       -> link-check
#   .github/workflows/pages.yml            -> pages
# GitHub-only (no GitLab equivalent): stale (bot), wiki-sync (dedicated
# GitHub wiki), CodeQL (no workflow configured in this project).
#
# NOTES
# * Jobs that invoke git install it explicitly: the alpine jobs use apk and
#   pester-tests uses apt. Images carry the other tools they need
#   (node:alpine, python:${PYTHON_VERSION} with a
#   3.11 + latest parallel matrix,
#   mcr.microsoft.com/powershell:latest -> git installed via apt in pester-tests, alpine -> apk git).
# * The runner shell is bash/sh; PowerShell is piped to `pwsh -Command -`
#   via a quoted heredoc (<<"'PWSH'">>), so the exact GitHub bodies run
#   verbatim with no quoting mangling.
# * The latest release and its checksum file are resolved together from the
#   release API, then verified with `sha256sum --check` before the tarball is
#   unpacked. The exact filename comes from the API response, so the checksum
#   always names the file that was downloaded.

variables:
  GIT_DEPTH: 0

stages:
  - scan
  - validate
  - test
  - links
  - deploy

# ------------------------------------------------------------------ Scan
# Mirror of .github/workflows/secret-scan.yml (latest gitleaks + checksum, full history).

secret-scan:
  stage: scan
  image: alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      set -eu
      apk add --no-cache git curl tar coreutils jq
      cd /tmp
      api=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest)
      tarball=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'linux_x64[.]tar[.]gz$' | head -n 1)
      checksum=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'checksums[.]txt$' | head -n 1)
      test -n "$tarball"
      test -n "$checksum"
      curl -sSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/latest/download/$tarball"
      curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/latest/download/$checksum"
      grep "$tarball" checksums.txt | sha256sum --check --strict
      tar -xzf "$tarball" gitleaks
  script:
    - cd "$CI_PROJECT_DIR" && /tmp/gitleaks git --redact --exit-code 1

# -------------------------------------------------------------- Validate
# Mirrors of .github/workflows/quality.yml, admx-validate.yml and
# version-check.yml.

markdown-lint:
  stage: validate
  image: node:alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - npm install --silent --global markdownlint-cli2
  script:
    - markdownlint-cli2 --config ".github/linters/.markdownlint.json" "**/*.md"

yaml-validate:
  stage: validate
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - pip install --quiet yamllint
  script:
    - yamllint .gitlab-ci.yml .github/ --config-file .github/linters/.yamllint.yml --format colored || exit 1

powershell-syntax:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      $files = Get-ChildItem -Path "." -Recurse -Filter "*.ps1" | Select-Object -ExpandProperty FullName
      $exitCode = 0
      foreach ($file in $files) {
        try {
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$null)
          Write-Host "OK $file"
        } catch {
          Write-Host "FAIL $file : $_"
          $exitCode = 1
        }
      }
      exit $exitCode
      PWSH

version-check:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
      changes: ["Brave-Omega/*.ps1"]
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      $mainContent = Get-Content -Path "Brave-Omega/BraveOmega.ps1" -Raw
      $verMatch = [regex]::Match($mainContent, '\$ScriptVersion\s*=\s*"([^"]+)"')
      if (-not $verMatch.Success) { Write-Error "Unified script version not found"; exit 1 }
      $ver = $verMatch.Groups[1].Value
      Write-Host "Unified version: $ver"
      if ($mainContent -match '\$BetikSurum') { Write-Error "Per-language version fork detected"; exit 1 }
      $verCount = ([regex]::Matches($mainContent, '\$ScriptVersion\s*=\s*"')).Count
      if ($verCount -ne 1) { Write-Error "Expected exactly one version assignment, found $verCount"; exit 1 }
      Write-Host "Version check passed: $ver"
      PWSH

hygiene:
  stage: validate
  image: alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: [".github/workflows/**"]
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      set -eu
      apk add --no-cache git curl tar coreutils jq
      cd /tmp
      api=$(curl -sSL https://api.github.com/repos/rhysd/actionlint/releases/latest)
      tarball=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'linux_amd64[.]tar[.]gz$' | head -n 1)
      checksum=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'checksums[.]txt$' | head -n 1)
      test -n "$tarball"
      test -n "$checksum"
      curl -sSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/latest/download/$tarball"
      curl -sSL -o checksums.txt "https://github.com/rhysd/actionlint/releases/latest/download/$checksum"
      grep "$tarball" checksums.txt | sha256sum --check --strict
      tar -xzf "$tarball"
  script:
    - cd "$CI_PROJECT_DIR" && /tmp/actionlint

admx-validate:
  stage: validate
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
      changes: ["ADMX/**", "Brave-Omega/BraveOmega.ps1"]
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      ./ADMX/ADMX-Validate.ps1
      if ($LASTEXITCODE -ne 0) { exit 1 }
      $localAdmx = "ADMX/Brave.admx"
      $oldVersion = ([regex]::Match(
        (Get-Content -LiteralPath $localAdmx -Raw),
        'brave version:\s*([\d.]+)')).Groups[1].Value
      if ([string]::IsNullOrWhiteSpace($oldVersion)) {
        Write-Warning "Could not read a version from $localAdmx"
      }
      try {
        $uri = "https://brave-browser-downloads.s3.brave.com/latest/policy_templates.zip"
        $zip = Join-Path ([System.IO.Path]::GetTempPath()) "policy_templates.zip"
        $dir = Join-Path ([System.IO.Path]::GetTempPath()) "policy_templates"
        Invoke-WebRequest -Uri $uri -OutFile $zip -UseBasicParsing
        if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
        $remoteAdmx = Get-ChildItem -LiteralPath $dir -Recurse -Filter "brave.admx" | Select-Object -First 1
        if (-not $remoteAdmx) {
          Write-Warning "Remote ADMX package has no Brave template; version comparison skipped."
        } else {
          $remoteVersion = ([regex]::Match((Get-Content -LiteralPath $remoteAdmx.FullName -Raw), 'brave version:\s*([\d.]+)')).Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($remoteVersion)) {
            Write-Warning "Remote Brave ADMX has no version comment; comparison skipped."
          } else {
            [version]$localParsed = $null; [version]$remoteParsed = $null
            $localOk = [version]::TryParse($oldVersion, [ref]$localParsed)
            $remoteOk = [version]::TryParse($remoteVersion, [ref]$remoteParsed)
            if ($localOk -and $remoteOk -and $remoteParsed -gt $localParsed) {
              Write-Warning "Brave ADMX $remoteVersion is newer than the repository copy $oldVersion. Refresh ADMX/Brave.admx and ADMX/Brave.adml."
            } elseif ($localOk -and $remoteOk -and $remoteParsed -lt $localParsed) {
              Write-Warning "Brave ADMX $remoteVersion is older than the repository copy $oldVersion. Investigate an upstream rollback."
            } else {
              Write-Host "Brave ADMX templates are current ($oldVersion)."
            }
          }
        }
      } catch {
        Write-Warning "Could not check Brave ADMX for updates: $($_.Exception.Message)"
      }
      PWSH

# ------------------------------------------------------------------ Test
# Mirror of .github/workflows/quality.yml (tests + analyzers; GH runs Pester
# on a ubuntu+windows matrix, GitLab runs the single Ubuntu-based image).

pester-tests:
  stage: test
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    # git: the regression suite reads its oracle out of history, and GIT_DEPTH 0
    #      is not enough on its own - the runner has to have a git to run.
    # python3: Tests/MojibakeScan.Tests.ps1 exercises Scripts/Mojibake-Scan.py
    #      through a real interpreter and throws rather than skipping when none
    #      is found. The PowerShell image carries no python, so the suite is
    #      installed here instead of being made to pass by going quiet.
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3
    - pwsh -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module -Name Pester -Force -SkipPublisherCheck"
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      Import-Module Pester -PassThru
      $config = New-PesterConfiguration
      $config.Run.Path = "Tests/"
      $config.Run.PassThru = $true
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputFormat = "NUnitXml"
      $config.TestResult.OutputPath = "test-results.xml"
      # Informational only: the suite executes extracted function blocks, so
      # Pester cannot attribute commands to BraveOmega.ps1. Mirrors the GitHub
      # Quality job; the percentage must never become a gate.
      $config.CodeCoverage.Path = @("Brave-Omega/BraveOmega.ps1")
      $config.CodeCoverage.Enabled = $true
      $config.CodeCoverage.OutputPath = "coverage.xml"
      $config.CodeCoverage.OutputFormat = "Cobertura"
      $config.CodeCoverage.CoveragePercentTarget = 0
      $config.Output.Verbosity = "Detailed"
      $result = Invoke-Pester -Configuration $config
      if ($result.FailedCount -gt 0) { exit 1 }
      PWSH
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results.xml
      - coverage.xml
    reports:
      junit: test-results.xml

ps-script-analyzer:
  stage: test
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - pwsh -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck"
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      $results = Invoke-ScriptAnalyzer -Path "Brave-Omega/BraveOmega.ps1" -Severity Warning -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingEmptyCatchBlock,PSUseSupportsShouldProcess,PSUseShouldProcessForStateChangingFunctions
      if ($results) { $results | Format-Table; exit 1 }
      PWSH

policy-integrity:
  stage: test
  image: mcr.microsoft.com/powershell:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      pwsh -NoProfile -Command - <<'PWSH'
      & "ADMX/ADMX-Validate.ps1"
      if ($LASTEXITCODE -ne 0) { exit 1 }
      PWSH

utf8-integrity:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    # Mojibake-Scan.py imports only os/re/sys, so the python image is the
    # whole toolchain here. No install step, and the run line is identical to
    # the GitHub one. This job additionally runs on 3.11 + latest via the
    # matrix; that widens coverage rather than changing the gate body.
    - python3 Scripts/Mojibake-Scan.py .

json-validity:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      for browser in brave chrome; do
        for tier in BraveOnly Essential Balanced Advanced Strict; do
          python3 Scripts/Render-PolicyJSON.py --browser "$browser" --tier "$tier" --platform linux > /dev/null || exit 1
        done
      done

shellcheck:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "latest"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - apt-get update && apt-get install -y shellcheck
    - shellcheck -S error Brave-Omega/Install-OmegaLinux.sh

# ------------------------------------------------------------------- Links
# Mirror of .github/workflows/link-check.yml.
#
# This stage sits after `test` on purpose. Every link in the check is fetched
# from a third party, so a rate limit or an outage on someone else's host is a
# fact about the network, not about this repository. While the job ran in
# `validate` it was the last one in that stage, and a 503 from github.com was
# therefore enough to skip pester-tests, policy-integrity, utf8-integrity and
# ps-script-analyzer: the gates that answer "is the code correct" never ran and
# the pipeline reported only "a link did not answer". The gate itself is
# unchanged - a broken link still fails the pipeline and still stops `deploy`.

link-check:
  stage: links
  image: alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: ["**/*.md"]
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      set -eu
      apk add --no-cache git curl tar coreutils jq
      cd /tmp
      api=$(curl -sSL https://api.github.com/repos/lycheeverse/lychee/releases/latest)
      tarball=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'x86_64-unknown-linux-musl[.]tar[.]gz$' | head -n 1)
      checksum=$(printf '%s' "$api" | jq -r '.assets[].name' | grep 'x86_64-unknown-linux-musl[.]tar[.]gz[.]sha256$' | head -n 1)
      test -n "$tarball"
      test -n "$checksum"
      curl -sSL -o "$tarball" "https://github.com/lycheeverse/lychee/releases/latest/download/$tarball"
      curl -sSL -o "$checksum" "https://github.com/lycheeverse/lychee/releases/latest/download/$checksum"
      sha256sum --check --strict "$checksum"
      tar -xzf "$tarball"
      mv /tmp/lychee-x86_64-unknown-linux-musl/lychee /tmp/lychee
  script:
    # lychee sends 10 simultaneous requests to one host by default. GitHub
    # Actions never sees that on github.com because lychee-action hands lychee
    # github.token, and a GitLab runner has no token to hand over; a burst of
    # anonymous requests from a shared runner is what github.com answers with
    # 503. The rate is lowered to what an anonymous client is expected to send,
    # and a throttled answer is retried after a real pause rather than the 1s
    # default. Identical arguments to the GitHub workflow. GitHub tracks
    # lychee-action@master while this job verifies a checksummed lychee release,
    # so the versions are not guaranteed equal; that gap stays a human read.
    #
    # Exclusions justified by evidence:
    # support.brave.app = Zendesk blocks bots with 403, a human browser works.
    # Specific ISO standard pages below = rate-limited / blocked for CI
    #   runners intermittently (429/403); they resolve in a browser and
    #   locally. Excluded by exact URL, not by iso.org domain.
    # '^file://' and --exclude-path 'chrome-policies' were removed after being
    # measured rather than trusted: lychee rewrites every relative Markdown link
    # into a file:// URL, so '^file://' was excluding every internal link in the
    # repository - 643 of 807 links in one run - not author-machine paths, and
    # 'chrome-policies' matched no tracked path at all. Removing it exposed 142
    # broken internal links, all of them fixed in the same commit.
    #
    # What this check cannot see: link fragments. The checked lychee release
    # resolves the target file and stops there, so an anchor matching no heading
    # passes as OK (verified with 0.24.2 by planting a bogus anchor). Fragments
    # stay a human read.
    #
    # Wiki page-form links are excluded below by exact shape, not by host:
    # GitHub Wiki serves `Page.md` as the raw file and `Page` as the rendered
    # page, so Wiki-internal links drop the suffix and lychee reads them as
    # missing files. The exclusion matches only that shape inside Wiki/ - a
    # `Page.md` link or a page-form link anywhere else is still checked. What
    # the exclusion hides is covered by name in Tests/WikiLinks.Tests.ps1,
    # which resolves every such link against the Wiki tree and pins this exact
    # exclusion text on both hosts.
    - |
      cd "$CI_PROJECT_DIR"
      /tmp/lychee \
        --no-progress --verbose \
        --max-retries 2 --retry-wait-time 5 \
        --host-concurrency 2 --host-request-interval 500ms \
        --exclude 'support\.brave\.app' \
        --exclude '^https://www\.iso\.org/standard/77520\.html$' \
        --exclude '^https://www\.iso\.org/standard/86308\.html$' \
        --exclude '^https://www\.iso\.org/standard/86612\.html$' \
        --exclude 'file://.*/Wiki/[A-Za-z-]+(#[^/]*)?$' \
        './**/*.md'

# ------------------------------------------------------------------ deploy
# Mirror of .github/workflows/pages.yml via GitLab Pages.

pages:
  stage: deploy
  image: node:alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p public
    - cp index.html public/
  artifacts:
    paths:
      - public
