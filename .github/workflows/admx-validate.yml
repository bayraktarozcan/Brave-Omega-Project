name: ADMX Policy Validation

on:
  push:
    branches: [main]
    paths:
      - 'Brave-Omega/BraveOmega.ps1'
      - 'admx/*'
  pull_request:
    branches: [main]
    paths:
      - 'Brave-Omega/BraveOmega.ps1'
      - 'admx/*'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate ADMX policy cross-reference
        shell: pwsh
        run: ./admx/admx-validate.ps1

      - name: Check for Brave ADMX updates
        shell: pwsh
        run: |
          # brave.admx carries the version in its own leading comment, so it is
          # the single source of truth. A separate version file would be a second
          # copy that drifts, and a multi-line one would not parse as a version.
          $localAdmx = "admx/brave.admx"
          $localVersion = ([regex]::Match(
            (Get-Content -LiteralPath $localAdmx -Raw),
            'brave version:\s*([\d.]+)')).Groups[1].Value

          if ([string]::IsNullOrWhiteSpace($localVersion)) {
            Write-Error "Could not read a version from $localAdmx"
            exit 1
          }
          Write-Host "Local ADMX version: $localVersion"

          $remoteUri = "https://brave-browser-downloads.s3.brave.com/latest/policy_templates.zip"
          $tempZip = Join-Path $env:RUNNER_TEMP "policy_templates.zip"
          $tempDir = Join-Path $env:RUNNER_TEMP "policy_templates"

          try {
            Invoke-WebRequest -Uri $remoteUri -OutFile $tempZip -UseBasicParsing
            if (Test-Path -LiteralPath $tempDir) {
              Remove-Item -LiteralPath $tempDir -Recurse -Force
            }
            Expand-Archive -LiteralPath $tempZip -DestinationPath $tempDir -Force

            $remoteAdmx = Get-ChildItem -LiteralPath $tempDir -Recurse -Filter "brave.admx" |
              Select-Object -First 1
            if (-not $remoteAdmx) {
              Write-Warning "Remote package contains no brave.admx; cannot compare versions"
              exit 0
            }

            $remoteVersion = ([regex]::Match(
              (Get-Content -LiteralPath $remoteAdmx.FullName -Raw),
              'brave version:\s*([\d.]+)')).Groups[1].Value

            if ([string]::IsNullOrWhiteSpace($remoteVersion)) {
              Write-Warning "Remote brave.admx carries no version comment; cannot compare versions"
              exit 0
            }

            Write-Host "Remote ADMX version: $remoteVersion"

            # Compare parsed versions, not the two strings. The strings can
            # differ while naming the same version ("154.1.98.28" and
            # "154.01.98.28"), and a string comparison would then fall through
            # to a direction test that cannot be true for equal numbers.
            [version]$localParsed = $null
            [version]$remoteParsed = $null
            $localOk = [version]::TryParse($localVersion, [ref]$localParsed)
            $remoteOk = [version]::TryParse($remoteVersion, [ref]$remoteParsed)
            $sameVersion = ($remoteVersion -eq $localVersion) -or
              ($localOk -and $remoteOk -and $remoteParsed -eq $localParsed)

            if ($sameVersion) {
              Write-Host "ADMX templates are current."
            } else {
              # Upstream shipping a newer ADMX is normal and not a build break,
              # so this warns rather than fails. It is no longer silent.
              #
              # The direction is tested, not assumed. A package that is *older*
              # than the copy in the repository is a different problem - a
              # rollback or a repackaged zip - and announcing that as an update
              # would send a maintainer to refresh files that are already ahead.
              # If either side will not parse as a version, the message stays
              # neutral instead of guessing.
              # The action follows the direction. Telling a maintainer to
              # refresh on an older package would be the defect the comment
              # above warns about, so the instruction is chosen here rather
              # than assumed to be the same in every branch.
              $direction = "differs from"
              $action = "Review the upstream package before changing the repository copy."
              if ($localOk -and $remoteOk) {
                if ($remoteParsed -gt $localParsed) {
                  $direction = "is newer than"
                  $action = "Refresh admx/brave.admx and admx/brave.adml from $remoteUri"
                } else {
                  $direction = "is older than"
                  $action = "Do not refresh: the repository copy is already ahead. Investigate the upstream rollback or repackaged archive."
                }
              }

              Write-Warning "Brave ADMX $direction the repository copy ($remoteVersion vs $localVersion)."
              Write-Warning $action
            }
          } catch {
            # The update check is informational. A network failure must not mask
            # the cross-reference validation that already ran above it.
            Write-Warning "Could not reach Brave S3 to check for updates: $($_.Exception.Message)"
          } finally {
            if (Test-Path -LiteralPath $tempZip) {
              Remove-Item -LiteralPath $tempZip -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $tempDir) {
              Remove-Item -LiteralPath $tempDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
