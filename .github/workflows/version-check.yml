# Brave Omega Project — Version Check
# Ensures the unified script carries a single version string and both
# language wrappers pin their language and forward to it.

name: "Version Check"

on:
  pull_request:
    branches: [main]
    paths:
      - "Brave Omega/*.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-sync:
    name: Check Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract version strings
        shell: pwsh
        run: |
          $mainContent = Get-Content -Path "Brave Omega/BraveOmega.ps1" -Raw
          $enContent = Get-Content -Path "Brave Omega/BraveOmega-EN.ps1" -Raw
          $trContent = Get-Content -Path "Brave Omega/BraveOmega-TR.ps1" -Raw

          $verMatch = [regex]::Match($mainContent, '\$ScriptVersion\s*=\s*"([^"]+)"')
          if (-not $verMatch.Success) { Write-Error "Unified script version not found"; exit 1 }
          $ver = $verMatch.Groups[1].Value
          Write-Host "Unified version: $ver"

          if ($mainContent -match '\$BetikSurum') { Write-Error "Per-language version fork detected"; exit 1 }

          foreach ($pair in @(@{ File = "Brave Omega/BraveOmega-EN.ps1"; Content = $enContent; Lang = "EN" },
                              @{ File = "Brave Omega/BraveOmega-TR.ps1"; Content = $trContent; Lang = "TR" })) {
            if ($pair.Content -notmatch "BraveOmega\.ps1") { Write-Error "$($pair.File) does not forward to BraveOmega.ps1"; exit 1 }
            if ($pair.Content -notmatch "\['Language'\] = '$($pair.Lang)'") { Write-Error "$($pair.File) does not pin Language to $($pair.Lang)"; exit 1 }
            Write-Host "✓ $($pair.File) pins Language to $($pair.Lang)"
          }

          Write-Host "✓ Version check passed: $ver"
