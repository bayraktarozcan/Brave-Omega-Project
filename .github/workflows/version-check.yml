# Brave Omega Project — Version Check
# Ensures the single unified script carries exactly one version string
# with no per-language fork.

name: "Version Check"

on:
  pull_request:
    branches: [main]
    paths:
      - "Brave Omega/*.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-sync:
    name: Check Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract version strings
        shell: pwsh
        run: |
          $mainContent = Get-Content -Path "Brave Omega/BraveOmega.ps1" -Raw

          $verMatch = [regex]::Match($mainContent, '\$ScriptVersion\s*=\s*"([^"]+)"')
          if (-not $verMatch.Success) { Write-Error "Unified script version not found"; exit 1 }
          $ver = $verMatch.Groups[1].Value
          Write-Host "Unified version: $ver"

          if ($mainContent -match '\$BetikSurum') { Write-Error "Per-language version fork detected"; exit 1 }

          $verCount = ([regex]::Matches($mainContent, '\$ScriptVersion\s*=\s*"')).Count
          if ($verCount -ne 1) { Write-Error "Expected exactly one version assignment, found $verCount"; exit 1 }

          Write-Host "✓ Version check passed: $ver"
