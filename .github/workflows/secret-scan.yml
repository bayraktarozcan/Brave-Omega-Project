# Brave Omega Project — Secret scanning
# Scans every commit in the repository history for leaked secrets with the latest
# gitleaks release, resolved together with its checksum at run time.

name: "Secret Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download latest gitleaks with its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://github.com/gitleaks/gitleaks/releases/latest/download
          gh api repos/gitleaks/gitleaks/releases/latest --jq '.assets[].name' > assets.txt
          tarball=$(grep 'linux_x64[.]tar[.]gz$' assets.txt | head -n 1)
          checksum=$(grep 'checksums[.]txt$' assets.txt | head -n 1)
          test -n "$tarball"
          test -n "$checksum"
          curl -sSL -o "$tarball" "$BASE/$tarball"
          curl -sSL -o checksums.txt "$BASE/$checksum"
          grep "$tarball" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball"

      - name: Scan repository history
        run: ./gitleaks git --redact --exit-code 1
