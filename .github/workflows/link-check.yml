# Brave Omega Project — Link Check
# Checks Markdown links weekly and on PRs touching docs. Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # One exclusion is left, and it is the one still justified by evidence:
          # support.brave.app = Zendesk blocks bots with 403, a human browser works.
          #
          # '^file://' and --exclude-path 'chrome-policies' were removed after
          # being measured rather than trusted. lychee rewrites every relative
          # Markdown link into a file:// URL, so '^file://' was not excluding
          # author-machine paths - it was excluding every internal link in the
          # repository, 643 of 807 links in one run, behind a reason that no
          # tracked file matches. 'chrome-policies' matched no tracked path at all.
          #
          # What this check cannot see: link fragments. lychee 0.24.2 resolves the
          # target file and stops there, so an anchor matching no heading passes
          # as OK (verified by planting a bogus anchor and watching it pass).
          # Fragments stay a human read.
          #
          # --host-concurrency / --host-request-interval = lychee defaults to 10
          #   simultaneous requests per host. This side is unaffected because the
          #   action passes github.token, the GitLab runner is not, and an
          #   anonymous burst at github.com is answered with 503. Both hosts run
          #   the same lychee version with the same values so they cannot drift
          #   into checking different things.
          args: >-
            --no-progress --verbose --max-retries 2 --retry-wait-time 5
            --host-concurrency 2 --host-request-interval 500ms
            --exclude 'support\.brave\.app'
            './**/*.md'
          fail: true
