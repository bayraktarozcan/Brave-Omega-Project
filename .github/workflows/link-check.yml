# Brave Omega Project — Link Check
# Checks Markdown links weekly and on PRs touching docs. Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # file:// = author-machine absolute paths, never valid in CI
          # support.brave.app = Zendesk blocks bots with 403, human browsers work
          # chrome-policies = vendored Chromium reference full of example URLs
          # --host-concurrency / --host-request-interval = lychee defaults to 10
          #   simultaneous requests per host. This side is unaffected because the
          #   action passes github.token, the GitLab runner is not, and an
          #   anonymous burst at github.com is answered with 503. Both hosts run
          #   the same lychee version with the same values so they cannot drift
          #   into checking different things.
          args: >-
            --no-progress --verbose --max-retries 2 --retry-wait-time 5
            --host-concurrency 2 --host-request-interval 500ms
            --exclude '^file://'
            --exclude 'support\.brave\.app' --exclude-path 'chrome-policies'
            './**/*.md'
          fail: true
