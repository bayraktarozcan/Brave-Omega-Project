# Brave Omega Project — Quality Checks
# Lint markdown, validate YAML, enforce code style, run tests, and validate policies.

name: "Quality"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"
          config: ".github/linters/.markdownlint.json"

  yaml-validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: |
          yamllint .github/ --config-file .github/linters/.yamllint.yml --format colored || exit 1

  powershell-syntax:
    name: Check PowerShell Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "." -Recurse -Filter "*.ps1" | Select-Object -ExpandProperty FullName
          $exitCode = 0
          foreach ($file in $files) {
            try {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$null)
              Write-Host "✓ $file"
            } catch {
              Write-Host "✗ $file : $_"
              $exitCode = 1
            }
          }
          exit $exitCode

  pester-tests:
    name: Pester Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The regression suite reads its oracle out of git history rather than
          # out of a hand-kept copy of the damage it is meant to catch, so the
          # checkout has to carry that history. Depth 1 leaves the blobs
          # unreachable and the suite reports a false failure that a local run
          # with a full clone cannot reproduce.
          fetch-depth: 0
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck
      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -PassThru
          $config = New-PesterConfiguration
          $config.Run.Path = "Tests/"
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "test-results.xml"
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputPath = "coverage.xml"
          $config.CodeCoverage.OutputFormat = "Cobertura"
          $config.CodeCoverage.CoveragePercentTarget = 0
          $config.Output.Verbosity = "Detailed"
          $result = Invoke-Pester -Configuration $config
          if ($null -ne $result.CodeCoverage) {
            $percent = [math]::Round($result.CodeCoverage.CoveredPercent, 2)
            Write-Host "Code coverage: $percent% (informational, no gate)"
          }
          if ($result.FailedCount -gt 0) { exit 1 }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  ps-script-analyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -SkipPublisherCheck
      - name: Run Invoke-ScriptAnalyzer on unified script
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path "Brave-Omega/BraveOmega.ps1" -Severity Warning -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingEmptyCatchBlock,PSUseSupportsShouldProcess,PSUseShouldProcessForStateChangingFunctions
          if ($results) { $results | Format-Table; exit 1 }

  policy-integrity:
    name: Policy Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate ADMX cross-references
        shell: pwsh
        run: |
          & "ADMX/ADMX-Validate.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  utf8-integrity:
    name: UTF-8 / Mojibake Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan repo for mojibake and invalid UTF-8
        run: |
          python3 Scripts/Mojibake-Scan.py .

  json-validity:
    name: Linux Policy JSON Validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Render every browser and tier combination
        run: |
          for browser in brave chrome; do
            for tier in BraveOnly Essential Balanced Advanced Strict; do
              python3 Scripts/Render-PolicyJSON.py --browser "$browser" --tier "$tier" --platform linux > /dev/null || exit 1
            done
          done

  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck -S error Scripts/Install-OmegaLinux.sh
