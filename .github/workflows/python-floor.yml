# Brave Omega Project — Python Floor Currency
# Reads the Python core team's release calendar weekly. When the declared floor
# reaches end of life, it opens one pull request, merges it after the usual
# checks, and mirrors the resulting main branch to GitLab. A merge made with
# GITHUB_TOKEN emits no push event, so the mirror step is explicit.

name: "Python Floor Currency"

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: python-floor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check Python Floor
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Compare declared floor with upstream calendar
        id: check
        shell: bash
        run: pwsh -NoProfile -File ./Scripts/Update-PythonFloor.ps1 -Command check

      - name: Open and merge floor bump pull request
        id: bump
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DESIRED: ${{ steps.check.outputs.desired }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/python-floor-${DESIRED}"

          EXISTING=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            git checkout -b "$BRANCH"
            pwsh -NoProfile -File ./Scripts/Update-PythonFloor.ps1 -Command apply -Version "$DESIRED"
            pwsh -NoProfile -File ./Scripts/Update-PythonFloor.ps1 -Command check
            if git diff --quiet; then
              echo "Floor bump produced no changes; refusing an empty pull request."
              exit 1
            fi
            git add -A
            git commit -m "chore(ci): bump Python floor to ${DESIRED}"
            git push origin "$BRANCH"
            PR=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "chore(ci): bump Python floor to ${DESIRED}" \
              --body "Python ${CURRENT} reached end of life per the Python core team's release calendar. This pull request raises the compatibility floor to ${DESIRED} in both CI manifests. Generated by the weekly Python Floor Currency workflow.")
          else
            PR="$EXISTING"
            echo "Pull request #${PR} is already open for ${DESIRED}; reusing it."
          fi

          for i in $(seq 1 20); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json state,mergeStateStatus \
              --jq '"\(.state)/\(.mergeStateStatus)"')
            echo "[wait ${i}] ${STATE}"
            case "$STATE" in
              MERGED/*)
                echo "merged=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              */BEHIND)
                gh pr update-branch --rebase "$PR" --repo "$REPO" || true
                ;;
            esac
            if gh pr checks "$PR" --repo "$REPO" --fail-fast >/dev/null 2>&1; then
              gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::floor bump pull request ${PR} is still pending; the next run retries it."

      - name: Check out main after merge
        if: steps.bump.outputs.merged == 'true'
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror main to GitLab
        if: steps.bump.outputs.merged == 'true'
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
          GITLAB_REPOSITORY: bayraktarozcan/Brave-Omega-Project
          GIT_TERMINAL_PROMPT: "0"
        run: |
          helper="$RUNNER_TEMP/git-credential-gitlab"
          cat > "$helper" <<'EOF'
          #!/bin/sh
          [ "$1" = "get" ] || exit 0
          echo username=oauth2
          echo "password=$GITLAB_PUSH_TOKEN"
          EOF
          chmod +x "$helper"
          git -c credential.helper= -c "credential.helper=$helper" \
            push "https://gitlab.com/${GITLAB_REPOSITORY}.git" HEAD:refs/heads/main
